<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyBridge - Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="#" class="logo">SupplyBridge*</a>

        <nav>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="#">Blog &#x25BE;</a>
                    <ul class="dropdown-menu">
                        <li><a href="#">Latest News</a></li>
                        <li><a href="#">Articles</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="#">Plans &#x25BE;</a>
                    <ul class="dropdown-menu">
                        <li><a href="#">Freelancer</a></li>
                        <li><a href="#">Startup</a></li>
                        <li><a href="#">Enterprise</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="#">Contact</a>
                </li>
            </ul>
        </nav>

        <div class="auth-buttons">
            <a href="#" class="btn-login">Log In</a>
            <a href="#" class="btn-signup">Sign Up</a>
        </div>
    </header>

    <main class="main-container">
        <div class="banner-title">SUPPLY BRIDGE TASK MANAGER</div>

        <div class="content-body">
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Enter a supply or warehouse task...">
                <select id="statusSelect">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <button type="button" class="btn-add" onclick="addTask()">Add Task</button>
            </div>

            <div class="board">
                <div class="column">
                    <h3>Pending</h3>
                    <div id="pendingList"></div>
                </div>

                <div class="column">
                    <h3>In Progress</h3>
                    <div id="inProgressList"></div>
                </div>

                <div class="column">
                    <h3>Completed</h3>
                    <div id="completedList"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Supply Bridge. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
